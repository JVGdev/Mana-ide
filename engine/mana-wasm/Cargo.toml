[package]
name = "mana-wasm"
description = "The engine for the spell tester, as WebAssembly"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
mana = { path = "../mana" }
serde_json = "1.0.151"
# Must match the wasm-bindgen CLI exactly (wasm-pack uses the installed one).
wasm-bindgen = "=0.2.128"

[lints]
workspace = true
