[package]
name = "mana-wasm"
description = "The engine for the spell tester, as WebAssembly"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mana = { path = "../mana" }
# Must match the wasm-bindgen CLI exactly (wasm-pack uses the installed one).
wasm-bindgen = "=0.2.128"
