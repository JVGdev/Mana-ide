# The engine (SPEC D41): the machine, the world, the assembler and the tools, in Rust.
[workspace]
resolver = "3"
members = ["mana", "mana-cli", "mana-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
debug = 1

# Tests run the world for hundreds of ticks: they need optimised code to finish in time.
[profile.test]
opt-level = 3

[profile.dev]
opt-level = 1

# The engine mirrors the TypeScript it was ported from, loop for loop and comparison for comparison (PLAN step R):
# indexed loops keep the order sums are taken in, and `!(x > 0)` keeps what JavaScript does with NaN.
[workspace.lints.clippy]
needless_range_loop = "allow"
neg_cmp_op_on_partial_ord = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
